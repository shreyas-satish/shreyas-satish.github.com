<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% if page.title == "Shreyas Satish" %}Shreyas Satish{% else %}{{ page.title }} · Shreyas Satish{% endif %}</title>
  <meta name="author" content="Shreyas Satish" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.summary | default: 'Writing, experiments, and small things by Shreyas Satish.' | strip_html | escape }}" />
  <link rel="canonical" href="https://shreyas.io{{ page.url }}" />
  {% include theme-init.html %}
  <link href="/css/fira-go.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  {% if page.fira_sans_test %}
    <link href="/css/fira-sans-test.css" rel="stylesheet">
  {% endif %}
  {% if page.uses_vue %}
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
  {% endif %}
</head>
<body{% if page.fira_sans_test %} class="fira-sans-test"{% endif %}>
  {% include header.html %}
  <main id="main-content" class="site-main{% if page.home %} site-main--home{% endif %}{% if page.work_page %} site-main--work{% endif %}{% if page.collection == "podcasts" %} site-main--podcast{% endif %}{% if page.url contains "/blog/" %} site-main--blog{% endif %}">
    {{ content }}
    {% if page.comments %}
      <div id="disqus_thread"></div>
    {% endif %}
  </main>
  {% include footer.html %}
  {% include theme-controls.html %}
</body>
</html>

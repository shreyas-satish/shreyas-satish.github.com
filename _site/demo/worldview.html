    <script>
  (function () {
    var storageKey = "shreyas-theme";
    var root = document.documentElement;

    function resolveTheme(storedTheme, hour) {
      if (storedTheme === "light" || storedTheme === "dark") return storedTheme;
      return hour >= 7 && hour < 19 ? "light" : "dark";
    }

    var storedTheme = null;
    try { storedTheme = localStorage.getItem(storageKey); } catch (error) {}

    var hasStoredTheme = storedTheme === "light" || storedTheme === "dark";
    var theme = resolveTheme(storedTheme, new Date().getHours());
    root.dataset.theme = theme;
    root.dataset.themeSource = hasStoredTheme ? "manual" : "auto";
    window.shreyasTheme = { resolveTheme: resolveTheme, storageKey: storageKey };
  }());
</script>

    <script>
  (function () {
    var root = document.documentElement;
    var toggle = document.querySelector("[data-theme-toggle]");
    if (!toggle || !window.shreyasTheme) return;

    function store(theme) {
      try { localStorage.setItem(window.shreyasTheme.storageKey, theme); } catch (error) {}
    }

    function updateControls() {
      var isDark = root.dataset.theme === "dark";
      var nextTheme = isDark ? "light" : "dark";
      toggle.setAttribute("aria-label", "Switch to " + nextTheme + " mode");
      toggle.setAttribute("aria-pressed", String(isDark));
      toggle.querySelector("[data-theme-icon]").textContent = isDark ? "☀" : "☾";
      toggle.querySelector("[data-theme-label]").textContent = "Switch to " + nextTheme + " mode";
    }

    toggle.addEventListener("click", function () {
      var nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = nextTheme;
      root.dataset.themeSource = "manual";
      store(nextTheme);
      updateControls();
    });

    updateControls();
  }());
</script>

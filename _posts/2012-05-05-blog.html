---
layout: default
title: Blog
permalink: /blog/
description: Essays and notes by Shreyas Satish.
---

<div class = 'content'>
  <ul class = 'articles'>
   {% for post in site.categories["blog"] %}
     <li>
       <h4><a href="{{ post.url }}">{{ post.title }}</a></h4>
       <div class = 'details'>
         {{ post.date | date_to_string }}
       </div>
     </li>
   {% endfor %}
  </ul>
</div>
